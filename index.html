<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROW BY SAVINGS - Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌱 GROW BY SAVINGS</h1>
            <p class="tagline">Track Your Money, Build Your Future</p>
        </div>
        
        <!-- Savings Target Section -->
        <div class="section">
            <h2>📊 Savings Target</h2>
            <div class="target-input">
                <input type="number" id="targetAmount" placeholder="Set your savings goal" min="0">
                <button onclick="setSavingsTarget()">Set Target</button>
            </div>
            <p id="targetDisplay">Target: Not set</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p id="progressText">Saved: $0 / Target: $0</p>
        </div>

        <!-- Add Transaction Section -->
        <div class="section">
            <h2>➕ Add Transaction</h2>
            <div class="form-group">
                <input type="text" id="description" placeholder="Description (e.g., Coffee, Salary)">
                <input type="number" id="amount" placeholder="Amount" min="0">
                <select id="type">
                    <option value="expense">💸 Expense</option>
                    <option value="income">💰 Income</option>
                </select>
                <select id="category">
                    <option value="food">🍔 Food</option>
                    <option value="travel">🚗 Travel</option>
                    <option value="entertainment">🎬 Entertainment</option>
                    <option value="utilities">💡 Utilities</option>
                    <option value="other">📌 Other</option>
                </select>
                <button onclick="addTransaction()">Add Transaction</button>
            </div>
        </div>

        <!-- Summary Section -->
        <div class="section">
            <h2>💵 Summary</h2>
            <div class="summary-box">
                <div class="summary-item">
                    <p>Total Income</p>
                    <p id="totalIncome" class="amount income">$0</p>
                </div>
                <div class="summary-item">
                    <p>Total Expense</p>
                    <p id="totalExpense" class="amount expense">$0</p>
                </div>
                <div class="summary-item">
                    <p>Balance</p>
                    <p id="balance" class="amount balance">$0</p>
                </div>
            </div>
        </div>

        <!-- Transactions List -->
        <div class="section">
            <h2>📋 Recent Transactions</h2>
            <div id="transactionsList" class="transactions-list">
                <p style="text-align: center; color: #999;">No transactions yet</p>
            </div>
            <button onclick="clearAllTransactions()" class="btn-clear">Clear All Transactions</button>
        </div>

        <div class="footer">
            <p>🔒 Your data is private - stored only on your device</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
